name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome reader and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install test browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("CHROMIUM_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm audit --omit=dev
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Restore pinned EPUB corpus source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/folio-epub-corpus
          key: ${{ runner.os }}-folio-corpus-${{ hashFiles('scripts/corpus.py') }}
      - run: npm test
        env:
          FOLIO_CORPUS_CACHE: ${{ runner.temp }}/folio-epub-corpus
      - run: npm run test:extension
      - run: npm run build:pages
      - run: npm run test:pages
      - run: node scripts/package.mjs
      - name: Upload extension ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folio-chrome-extension
          path: .output/folio-*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .output/pages
      - name: Summarize browser test failures
        if: failure()
        run: python3 scripts/ci-summary.py
      - name: Upload failed-test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  pages:
    name: Deploy GitHub Pages preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: chrome
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Use the tested workflow as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$current_source" = "workflow" ]; then
            echo "Pages already uses GitHub Actions."
          elif gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --silent 2>pages-source-error.txt; then
            echo "Pages source is GitHub Actions."
          else
            python3 - <<'PY_WARNING'
          from pathlib import Path
          message=Path('pages-source-error.txt').read_text()[:1200]
          message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::warning title=Pages source needs a repository owner::Set Settings > Pages > Source to GitHub Actions. Deployment will continue. '+message)
          PY_WARNING
          fi
      - name: Publish tested preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
