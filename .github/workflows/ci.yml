name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome reader and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the previous failed-test evidence
        uses: actions/download-artifact@v4
        with:
          name: browser-test-results
          path: .output/prior-failure
          run-id: 40892560089
          github-token: ${{ github.token }}
      - name: Summarize the previous failure
        run: |
          python3 - <<'PY_SUMMARY'
          from pathlib import Path
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
            output.write('## Previous run failure evidence\n\n')
            for path in Path('.output/prior-failure').rglob('error-context.md'):
              text=path.read_text()
              if '# Error details' in text:text=text.split('# Error details',1)[1].split('# Test source',1)[0]
              output.write('### '+path.parent.name+'\n\n'+text[:10000]+'\n\n')
              notice=text[:4000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Previous failed test '+path.parent.name+'::'+notice)
          PY_SUMMARY
      - run: npm ci
      - name: Install test browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("CHROMIUM_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run build:pages
      - run: npm run test:pages
      - run: python3 scripts/package.py
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: folio-chrome-extension
          path: .output/folio-*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/pages
      - name: Summarize browser test failures
        if: failure()
        run: python3 scripts/ci-summary.py
      - name: Upload failed-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  pages:
    name: Deploy GitHub Pages preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: chrome
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Use the tested workflow as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --silent 2>pages-source-error.txt; then
            echo "Pages source is GitHub Actions."
          else
            python3 - <<'PY_WARNING'
          from pathlib import Path
          message=Path('pages-source-error.txt').read_text()[:1200]
          message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::warning title=Pages source needs a repository owner::Set Settings > Pages > Source to GitHub Actions. Deployment will continue. '+message)
          PY_WARNING
          fi
      - name: Publish tested preview
        id: deployment
        uses: actions/deploy-pages@v4
