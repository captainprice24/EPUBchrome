name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome reader and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install test browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log("CHROMIUM_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Restore pinned EPUB corpus source cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/folio-epub-corpus
          key: ${{ runner.os }}-folio-corpus-${{ hashFiles('scripts/corpus.py') }}
      - run: npm test
        env:
          FOLIO_CORPUS_CACHE: ${{ runner.temp }}/folio-epub-corpus
      - run: npm run build:pages
      - run: npm run test:pages
      - run: python3 scripts/package.py
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: folio-chrome-extension
          path: .output/folio-*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/pages
      - name: Summarize browser test failures
        if: failure()
        run: python3 scripts/ci-summary.py
      - name: Upload failed-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  pages:
    name: Deploy GitHub Pages preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: chrome
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Use the tested workflow as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$current_source" = "workflow" ]; then
            echo "Pages already uses GitHub Actions."
          elif gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --silent 2>pages-source-error.txt; then
            echo "Pages source is GitHub Actions."
          else
            python3 - <<'PY_WARNING'
          from pathlib import Path
          message=Path('pages-source-error.txt').read_text()[:1200]
          message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::warning title=Pages source needs a repository owner::Set Settings > Pages > Source to GitHub Actions. Deployment will continue. '+message)
          PY_WARNING
          fi
      - name: Publish tested preview
        id: deployment
        uses: actions/deploy-pages@v4
