name: Release

# Pushing a tag such as v0.6.0 checks the build and publishes the extension
# ZIP as a GitHub release. Uploading to the Chrome Web Store stays manual.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the extension ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd .output
          sha256sum folio-*-chrome.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" folio-*-chrome.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Folio ${GITHUB_REF_NAME#v}" --generate-notes
